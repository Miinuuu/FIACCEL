[connectivity]
nk=FIACCEL:1:FIACCEL_1
sp=FIACCEL_1.m00_axi:DDR[0]
sp=FIACCEL_1.m01_axi:DDR[1]
sp=FIACCEL_1.m02_axi:DDR[0]

[clock]
freqHz=300000000:FIACCEL_1.ap_clk

[vivado]
impl.jobs=4
synth.jobs=8
prop=run.impl_1.strategy=Congestion_SSI_SpreadLogic_high
prop=run.impl_1.STEPS.PLACE_DESIGN.ARGS.DIRECTIVE=SSI_BalanceSLRs
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.IS_ENABLED=true
prop=run.impl_1.STEPS.PHYS_OPT_DESIGN.ARGS.DIRECTIVE=AggressiveExplore
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.IS_ENABLED=true
prop=run.impl_1.STEPS.POST_ROUTE_PHYS_OPT_DESIGN.ARGS.DIRECTIVE=Explore

[advanced]
param=compiler.enableAutoFrequencyScaling=true
