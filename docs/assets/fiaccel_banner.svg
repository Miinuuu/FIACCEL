<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">FIACCEL — Memory Efficient Frame Interpolation</title>
  <desc id="desc">Two source frames pass through a flow estimation network and frame synthesizer to produce an intermediate frame.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1527"/><stop offset="1" stop-color="#16334a"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#58e0c4"/><stop offset="1" stop-color="#64b5ff"/></linearGradient>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <path d="M0 235H1200M800 0V280M1000 0V280" stroke="#ffffff" stroke-opacity=".035"/>
  <text x="54" y="83" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#f3f8ff" letter-spacing="4">FIACCEL</text>
  <text x="56" y="119" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#a8c4d7">Memory Efficient Frame Interpolation</text>
  <rect x="56" y="151" width="294" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="56" y="187" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#a8c4d7">INT8 NETWORK · SELECTIVE TRANSFER</text>
  <text x="56" y="212" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#a8c4d7">PROTECTED RTL · VIVADO XSIM</text>
  <g font-family="Arial,Helvetica,sans-serif" text-anchor="middle">
    <rect x="480" y="76" width="112" height="78" rx="10" fill="#1e4057" stroke="#58e0c4"/>
    <rect x="493" y="89" width="86" height="52" rx="4" fill="#254e65"/>
    <text x="536" y="185" font-size="15" fill="#c6dceb">Source frames</text>
    <path d="M610 115H649L641 107M649 115L641 123" fill="none" stroke="#58e0c4" stroke-width="2"/>
    <rect x="670" y="72" width="224" height="88" rx="12" fill="#1a354b" stroke="#5bbfdc"/>
    <text x="782" y="109" font-size="18" fill="#f3f8ff">Flow + synthesis</text>
    <text x="782" y="135" font-size="13" fill="#a8c4d7">encode · reuse · decode · blend</text>
    <path d="M914 115H953L945 107M953 115L945 123" fill="none" stroke="#64b5ff" stroke-width="2"/>
    <rect x="974" y="76" width="112" height="78" rx="10" fill="#21425c" stroke="#64b5ff"/>
    <path d="M992 134L1016 104L1033 123L1052 94L1070 134Z" fill="#64b5ff" fill-opacity=".5"/>
    <text x="1030" y="185" font-size="15" fill="#c6dceb">Midpoint frame</text>
  </g>
</svg>
