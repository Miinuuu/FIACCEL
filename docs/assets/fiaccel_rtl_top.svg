<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="880" viewBox="0 0 1600 880" role="img" aria-labelledby="title desc">
<title id="title">FIACCEL RTL architecture</title>
<desc id="desc">Figure 2 datapath: a three-stage encoder, feature map reuse and selective transfer, a shared window feeding four horizontally dilated convolutions, pointwise shrink, three-stage decoder and three-channel motion and mask head. A registered credit pipeline feeds bounded-cache frame synthesis. Three AXI masters connect input and coefficient loading, feature history, and sample reads and RGB output to DDR. Logical architecture, not physical FPGA placement.</desc>
